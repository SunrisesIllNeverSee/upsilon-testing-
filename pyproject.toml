[project]
name = "upsilon-financial-integrity"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115",
  "pydantic>=2.8",
  "sqlalchemy>=2.0",
  "psycopg[binary]>=3.2",
  "alembic>=1.13",
  "httpx>=0.27",
  "beautifulsoup4>=4.12",
  "pandas>=2.2"
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "ruff>=0.6"]

# ---------------------------------------------------------------------------
# Package layout — src/upsilon is the target engine package
# ---------------------------------------------------------------------------
[tool.setuptools.packages.find]
where = ["src", "."]
include = ["upsilon*"]

[tool.setuptools.package-dir]
"" = "."

# ---------------------------------------------------------------------------
# Pytest configuration — staged test discovery migration
# ---------------------------------------------------------------------------
#
# The report specified a staged migration of test discovery boundaries:
#
#   Phase 0 (current):  python_files = ["test_*.py"]   (root still has tests)
#   Phase 1 (next):     testpaths = ["tests", "."]      (some tests moved)
#   Phase 2 (final):    testpaths = ["tests"]           (all tests moved)
#
# We are at Phase 1.  The src/upsilon test suite lives under tests/unit/;
# legacy root tests remain at the project root.  The collection boundary
# is restricted to test_*.py files so that moving a non-test file does
# not accidentally change test discovery.  When all root tests have moved
# to tests/, advance to Phase 2: testpaths = ["tests"].
#
# Do NOT set testpaths = ["."] — that means "look everywhere" and defeats
# the purpose of an explicit collection boundary.

[tool.pytest.ini_options]
testpaths = ["tests", "."]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
