name: Upsilon Test Suite

on:
  push:
    branches: ["main", "develop"]
  pull_request:
    branches: ["main"]
  workflow_dispatch:

jobs:
  unit-tests:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install package
        run: |
          python -m pip install --upgrade pip
          pip install -e .
          pip install pytest

      - name: Run full test suite
        run: pytest -q

  postgres-integration:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: upsilon
          POSTGRES_USER: upsilon
          POSTGRES_PASSWORD: upsilon
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U upsilon -d upsilon"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      TEST_DATABASE_URL: postgresql://upsilon:upsilon@localhost:5432/upsilon

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install package
        run: |
          python -m pip install --upgrade pip
          pip install -e .
          pip install pytest

      - name: Initialize database schema
        env:
          PGPASSWORD: upsilon
        run: |
          psql \
            -h localhost \
            -U upsilon \
            -d upsilon \
            -f schema.sql

      - name: Run PostgreSQL integration test
        run: |
          pytest -q test_persistence_integration.py
